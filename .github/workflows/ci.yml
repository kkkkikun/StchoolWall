name: Production CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # 私有库上 gitleaks-action 在 PR 模式下要列出 PR 的提交才能确定扫描区间，
  # 缺这一项会 403（Resource not accessible by integration），门禁直接跑不起来。
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ey_wall_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ey_wall_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ey_wall_test
      REDIS_URL: redis://127.0.0.1:6379/14
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET: ci-only-never-production-0123456789abcdef
      VERIFICATION_FINGERPRINT_KEY: ci-only-independent-fingerprint-key-0123456789
      DEV_LOGIN_ENABLED: "true"
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.10", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: python -m pip install -r backend/requirements.txt pip-audit
      - name: Backend integration and operational regressions
        run: |
          cd backend
          python -m pytest -q
          cd ..
          python -m unittest discover -s scripts/tests -v
      - name: Migration chain from empty DB and previous revision
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def create():
              conn = await asyncpg.connect("postgresql://postgres:postgres@127.0.0.1:5432/postgres")
              await conn.execute("CREATE DATABASE ey_wall_migration")
              await conn.close()
          asyncio.run(create())
          PY
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ey_wall_migration
          export MIGRATION_TEST_ACK=YES_ISOLATED_DATABASE
          python scripts/check_migrations.py
          POSTGRES_TEST_CONTAINER="${{ job.services.postgres.id }}" python scripts/check_restore.py
      - name: Validate and export API contract
        run: |
          mkdir -p release
          cd backend
          python ../scripts/check_api_contract.py --output ../release/openapi.json
      - name: Dependency vulnerability gate
        run: pip-audit -r backend/requirements.txt --strict
      - name: Secret scanning gate
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin-frontend/package-lock.json
      - name: Web, WeChat and admin contract builds
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          cd frontend
          npm ci
          npm run generate:api
          npm run type-check
          npm test
          npm run build:h5
          npm run build:mp-weixin
          npm run build:android
          npm audit --registry=https://registry.npmjs.org --audit-level=high
          cd ../admin-frontend
          npm ci
          npm run type-check
          npm test
          npm run build:admin
          npm audit --registry=https://registry.npmjs.org --audit-level=high
      - name: OpenSpec specification validation
        run: npx --yes @fission-ai/openspec@1.4.1 validate --specs
      - name: Icon registry consistency check
        run: python3 frontend/scripts/icon-consistency-check.py
      - name: Admin Element Plus style coverage check
        run: python3 admin-frontend/scripts/style-coverage-check.py
      - name: Frontend bundle performance budget
        run: python3 frontend/scripts/perf-budget-check.py
      - name: Admin bundle performance budget
        run: python3 admin-frontend/scripts/bundle-budget-check.py
      - name: Browser-level UI regression
        env:
          # 管理台按 --base=/admin/ 出制品（nginx location /admin/），走查须同前缀访问
          ADMIN_BASE_PREFIX: /admin
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          cd frontend
          for s in all-pages-walkthrough ui-walkthrough ui-walkthrough-desktop \
                   publish-walkthrough publish-upload-walkthrough \
                   web-login-guard-walkthrough post-detail-walkthrough; do
            echo "::group::frontend/scripts/$s.py"
            python3 "scripts/$s.py"
            echo "::endgroup::"
          done
          cd ../admin-frontend
          for s in all-views-walkthrough ui-walkthrough nav-svg-walkthrough \
                   dashboard-walkthrough users-view-walkthrough posts-view-walkthrough \
                   comments-view-walkthrough reports-view-walkthrough \
                   appeals-view-walkthrough moderation-jobs-view-walkthrough \
                   student-verifications-walkthrough; do
            echo "::group::admin-frontend/scripts/$s.py"
            python3 "scripts/$s.py"
            echo "::endgroup::"
          done
      - name: Objective UI defect audit
        run: |
          python3 scripts/preview.py web --port 8080 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          curl -sf --noproxy '*' --retry 30 --retry-delay 1 --retry-connrefused \
               --retry-max-time 60 http://127.0.0.1:8080/ >/dev/null
          python3 frontend/scripts/ui-contrast-audit.py
          # 断言 H5 不向第三方域名发请求（uni-app 框架曾预加载 dcloud CDN 阴影图）
          python3 frontend/scripts/external-request-check.py --base-url http://127.0.0.1:8080
          # 顺带采集运行时首屏指标（FCP/DCL/LCP）写进体积预算报告，仅供横向比较、不拦截
          python3 frontend/scripts/perf-budget-check.py --base-url http://127.0.0.1:8080
      - name: Package verified web and contract artifacts
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/verified-release"
          mkdir -p "$ARTIFACT_DIR/web/h5" "$ARTIFACT_DIR/web/admin" "$ARTIFACT_DIR/deploy"
          python -m pip freeze > "$ARTIFACT_DIR/python-constraints.txt"
          cp release/openapi.json "$ARTIFACT_DIR/"
          cp -a frontend/dist/build/h5/. "$ARTIFACT_DIR/web/h5/"
          cp -a admin-frontend/dist/. "$ARTIFACT_DIR/web/admin/"
          cp -a deploy/docker-compose.prod.yml deploy/healthcheck.sh "$ARTIFACT_DIR/deploy/"
          cp scripts/rollout.sh scripts/rollback-release.sh "$ARTIFACT_DIR/"
          tar -czf verified-web.tar.gz -C "$ARTIFACT_DIR" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-web
          path: verified-web.tar.gz
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-package
          path: frontend/dist/build/mp-weixin/
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-code-bundle
          path: frontend/dist/build/app/
          retention-days: 30

  image:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: verified-web, path: tested-artifact}
      - name: Use the exact tested Python dependency constraints
        id: constraints
        run: |
          mkdir -p tested-artifact/unpacked
          tar -xzf tested-artifact/verified-web.tar.gz -C tested-artifact/unpacked ./python-constraints.txt
          echo "sha256=$(sha256sum tested-artifact/unpacked/python-constraints.txt | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry namespace
        id: registry
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          load: true
          tags: schoolwall-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: constraints=tested-artifact/unpacked/python-constraints.txt
          build-args: CONSTRAINTS_SHA256=${{ steps.constraints.outputs.sha256 }}
      - name: Smoke exact built image before push
        run: |
          docker run --rm --network=none --entrypoint python \
            -e ENVIRONMENT=test -e JWT_SECRET=ci-only-never-production-0123456789abcdef \
            schoolwall-ci:"$GITHUB_SHA" -c "from app.main import app; assert '/health/live' in app.openapi()['paths']; print('built image imports and exports contract')"
      - name: Scan exact production image before push
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: schoolwall-ci:${{ github.sha }}
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
      - name: Push verified image and resolve immutable digest
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
        run: |
          docker tag schoolwall-ci:"$GITHUB_SHA" "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          IMAGE="$IMAGE@$DIGEST" python - <<'PY'
          import json, os
          from pathlib import Path
          Path("manifest.json").write_text(json.dumps({"revision": os.environ["GITHUB_SHA"], "backend_image": os.environ["IMAGE"]}, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: release-manifest, path: manifest.json, retention-days: 30}
