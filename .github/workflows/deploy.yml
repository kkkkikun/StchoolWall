name: Staging then Production
on:
  workflow_run:
    workflows: ["Production CI"]
    types: [completed]
    branches: [main]
permissions: {contents: read, actions: read}
concurrency:
  group: schoolwall-release
  cancel-in-progress: false
jobs:
  staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-web
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-manifest
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release provenance and create transport
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import json, os, re
          m = json.load(open("release/manifest.json"))
          assert m["revision"] == os.environ["EXPECTED_REVISION"]
          assert re.fullmatch(r"ghcr.io/[a-z0-9_./-]+@sha256:[a-f0-9]{64}", m["backend_image"])
          PY
          tar -xzf release/verified-web.tar.gz -C release
          rm release/verified-web.tar.gz
          tar -czf release.tar.gz -C release .
          sha256sum release.tar.gz > release.tar.gz.sha256
      - name: Transfer and deploy staging
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER: ${{ secrets.SERVER_HOST }}
          USERNAME: ${{ secrets.SERVER_USERNAME }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -o StrictHostKeyChecking=yes release.tar.gz release.tar.gz.sha256 "$USERNAME@$SERVER:/opt/schoolwall/incoming/"
          ssh -o StrictHostKeyChecking=yes "$USERNAME@$SERVER" 'cd /opt/schoolwall/incoming && sha256sum -c release.tar.gz.sha256 && UNPACK="$(mktemp -d /opt/schoolwall/incoming/release.XXXXXX)" && tar -xzf release.tar.gz -C "$UNPACK" && bash "$UNPACK/rollout.sh" /opt/schoolwall "$UNPACK"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-release
          path: |
            release.tar.gz
            release.tar.gz.sha256
          retention-days: 30

  production:
    needs: staging
    runs-on: ubuntu-latest
    # Configure required reviewers + protected main in repository environment settings.
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: staged-release, path: .}
      - name: Deploy the identical staged artifact
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER: ${{ secrets.SERVER_HOST }}
          USERNAME: ${{ secrets.SERVER_USERNAME }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -o StrictHostKeyChecking=yes release.tar.gz release.tar.gz.sha256 "$USERNAME@$SERVER:/opt/schoolwall/incoming/"
          ssh -o StrictHostKeyChecking=yes "$USERNAME@$SERVER" 'cd /opt/schoolwall/incoming && sha256sum -c release.tar.gz.sha256 && UNPACK="$(mktemp -d /opt/schoolwall/incoming/release.XXXXXX)" && tar -xzf release.tar.gz -C "$UNPACK" && bash "$UNPACK/rollout.sh" /opt/schoolwall "$UNPACK"'
