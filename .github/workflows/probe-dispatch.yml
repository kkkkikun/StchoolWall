# 一次性链路自检：以 github-actions[bot] 身份发一条派活 issue，验证派活通道。
name: Probe dispatch

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Open the probe issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: "前端/管理台 API 契约漂移守卫"
          BRIEF: "落实 .claude/docs/tasks.md 待办「前端页面与后端 API 的契约校验（可考虑 OpenAPI 自动生成类型）」里仍然缺的那一半：类型生成已在 CI 跑（npm run generate:api），但入库的 frontend/src/types/generated-api.ts 是否与后端契约一致、以及前端/管理台调用的 /api/v1/** 路径是否真实存在于后端契约，目前没有任何自动判定。

目标：在 frontend/scripts/ 新增一个契约漂移守卫脚本（与既有 icon-consistency-check.py、perf-budget-check.py 同族），做两件事：① 用 release/openapi.json 重新生成类型并与入库的 frontend/src/types/generated-api.ts 比对，不一致即指出差异；② 断言 frontend/src/api/*.ts 与 admin-frontend/src/api/*.ts 中出现的 /api/v1/** 路径字面量都存在于后端 OpenAPI 契约里。任一不满足即非零退出，并接入 CI（与既有静态守卫同一批步骤）。

边界：不新增产品功能、不改后端接口、不手工编辑生成文件内容（生成文件仍只由 npm run generate:api 产出）、不引入新的运行时依赖。

验证：① 正常跑 exit 0；② 负向验证 —— 手改生成文件一字节、或写一个不存在的 API 路径，均须 exit 1 并指出具体项；③ 恢复后重新 exit 0；④ CI 的前端 type-check 与三端构建不受影响。

【链路自检轮次】这一轮由自动派活工作流发起，用来验证「派活方 → 推断候选 → 受理」这条链路是否通畅。请不要修改任何文件、不要创建 PR、不要改动 .agent/dispatch-queue.json，只在原 issue 里报告你收到的任务标题即可。"
          ID: probe-dispatch-001
        run: |
          set -euo pipefail
          BODY=$(printf '@LL-ki %s\n\n<!-- agent-dispatch:%s -->\n' "$BRIEF" "$ID")
          gh issue create --repo "$REPO" --title "[agent-dispatch] $TITLE" --body "$BODY"
