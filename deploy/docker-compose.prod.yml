# Immutable images only. Initial configuration and backup setup: deploy/README.md.
name: schoolwall
x-app: &app
  image: ${BACKEND_IMAGE:?set an immutable backend image digest}
  restart: unless-stopped
  env_file: ${APP_ENV_FILE:-.env.prod}
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${DB_USER:-eywall}:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/ey_wall
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    BUILD_REVISION: ${BUILD_REVISION:?set release commit}
    # Uvicorn reads this environment variable; only the host bridge gateway is trusted.
    FORWARDED_ALLOW_IPS: ${SCHOOLWALL_GATEWAY:-172.30.0.1}
    # 备份状态文件（deploy/backup.sh 写）：应用 /metrics 据此暴露备份新鲜度与
    # 备份失败信号。状态文件里只有时间戳与计数，没有备份路径、密钥或备份内容，
    # 因此以只读方式挂进容器。
    BACKUP_STATUS_FILE: /data/backup-status/backup_status.json
  volumes:
    - static_uploads:/data/static
    - private_media:/data/private-media
    - private_verifications:/data/private-verifications
    # 反馈截图是测试现场，必须跨容器重建留存
    - private_feedback:/data/private-feedback
    # 备份状态目录（只读）：BACKUP_STATUS_DIR 与 deploy/backup.sh 用同一个主机路径
    - ${BACKUP_STATUS_DIR:-/opt/schoolwall/backup-status}:/data/backup-status:ro
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  stop_grace_period: 45s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-eywall}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ey_wall
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eywall} -d ey_wall"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      options: {max-size: "10m", max-file: "5"}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH='${REDIS_PASSWORD}' redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      options: {max-size: "10m", max-file: "5"}

  backend:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]

  migrate:
    <<: *app
    restart: "no"
    profiles: ["tools"]
    command: ["python", "-m", "alembic", "upgrade", "head"]

volumes:
  private_media:
  private_verifications:
  private_feedback:
  pgdata:
  redisdata:
  static_uploads:

# Host Nginx reaches the loopback-published API through this exact bridge gateway.
# Choose a non-conflicting subnet/gateway before the first deployment; never trust "*".
networks:
  default:
    ipam:
      config:
        - subnet: ${SCHOOLWALL_SUBNET:-172.30.0.0/24}
          gateway: ${SCHOOLWALL_GATEWAY:-172.30.0.1}
