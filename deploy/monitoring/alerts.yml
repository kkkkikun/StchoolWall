groups:
  - name: schoolwall
    rules:
      - alert: SchoolWallUnavailable
        expr: probe_success{job="schoolwall-probes"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "SchoolWall readiness/liveness probe failed"
          runbook: "docs/production/runbook.md"
      - alert: SchoolWallProbeSlow
        expr: probe_duration_seconds{job="schoolwall-probes"} > 2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "SchoolWall probes exceed two seconds"}
      - alert: SchoolWallCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job="schoolwall-probes"} - time() < 14 * 86400
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "SchoolWall certificate expires within fourteen days"}
      - alert: SchoolWallMonitorTargetMissing
        # postgres-exporter 一并纳入：DB 锁等待信号完全来自它，exporter 掉线
        # （没部署、缺 DSN、账号没权限）时那两条锁等待规则收不到任何信号 ——
        # 信号缺失必须让人看见，不能静默。
        expr: up{job=~"schoolwall-api|schoolwall-probes|postgres-exporter"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "SchoolWall monitoring target unavailable"}
      - alert: SchoolWallApiErrors
        expr: sum(rate(schoolwall_http_requests_total{route=~"/api/.*",status=~"5.."}[5m])) / clamp_min(sum(rate(schoolwall_http_requests_total{route=~"/api/.*"}[5m])), 0.001) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "SchoolWall API errors exceed one percent"}
      - alert: SchoolWallApiSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(schoolwall_http_duration_seconds_bucket{route=~"/api/.*"}[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "SchoolWall API p95 exceeds one second"}
      # 任务队列信号：阈值与持续时长照抄 docs/production/runbook.md「首发告警目标」表的 jobs 行
      # （oldest pending>10分钟5分钟、dead>0、running lease过期）——表内没给持续时长的两项按立即触发处理。
      # 最老待处理任务的等待秒数按入队时间算（app/metrics.py 里的口径说明）。
      - alert: SchoolWallJobsBacklog
        expr: schoolwall_jobs_oldest_pending_age_seconds > 600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "SchoolWall oldest pending job has waited over ten minutes"
          runbook: "docs/production/runbook.md"
      - alert: SchoolWallJobsDeadLetters
        expr: schoolwall_jobs_dead > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "SchoolWall has dead letter jobs waiting for a manual replay"}
      - alert: SchoolWallJobsLeaseExpired
        expr: schoolwall_jobs_running_lease_expired > 0
        for: 0m
        labels: {severity: warning}
        annotations: {summary: "SchoolWall has running jobs whose lease has expired"}
      # DB/Redis 的应用侧信号：阈值与持续时长照抄 docs/production/runbook.md
      # 「首发告警目标」表的 DB/Redis 行（pool使用>80% 10分钟、Redis失败>0）。
      # 使用率是「已用连接 / 连接预算」：连接预算 = DB_POOL_SIZE + DB_MAX_OVERFLOW，
      # 与 runbook「数据库连接总预算」的口径一致（见 backend/app/metrics.py）。
      # Redis 失败用 increase()：计数只会递增，直接 > 0 会一直挂着不再恢复；
      # increase() 让「最近 5 分钟内有过失败」成立、最近 5 分钟没有失败就自动恢复。
      - alert: SchoolWallDbPoolPressure
        expr: schoolwall_db_pool_usage_ratio > 0.8
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "SchoolWall database connection pool usage exceeds eighty percent"
          runbook: "docs/production/runbook.md"
      - alert: SchoolWallRedisFailures
        expr: increase(schoolwall_redis_failures_total[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "SchoolWall Redis calls are failing"
          runbook: "docs/production/runbook.md"
      # DB 锁等待信号：阈值照抄 docs/production/runbook.md「首发告警目标」表的
      # DB/Redis 行（锁等待会话>0、死锁增长>0）——该行原本只写「锁等待上升」，
      # 收敛成明确数值的依据写在 runbook 同一节的说明里。
      # 表内没给持续时长，按仓库既有做法（jobs 行、备份行、容量行同样没给的项）
      # 立即触发。
      # 指标来自 postgres_exporter（deploy/monitoring/compose.monitoring.yml 的
      # postgres-exporter 服务 + deploy/monitoring/prometheus.yml 的
      # postgres-exporter 抓取作业）：
      #   pg_stat_activity_count —— 按 wait_event_type 维度统计的会话数，
      #     wait_event_type="Lock" 即「当前正在等锁的会话」；
      #   pg_stat_database_deadlocks —— 死锁计数（counter），用增长量判定。
      # 注意 pg_locks_count 统计的是已持有的锁（含已授予），分不出等待与持有，
      # 故不用它判定锁等待。
      - alert: SchoolWallDbLockWaitRising
        expr: sum(pg_stat_activity_count{wait_event_type="Lock"}) > 0
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "SchoolWall has database sessions waiting on a lock"
          runbook: "docs/production/runbook.md"
      - alert: SchoolWallDbDeadlockRising
        expr: increase(pg_stat_database_deadlocks[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "SchoolWall database deadlock counter is growing"
          runbook: "docs/production/runbook.md"
      # 备份侧信号：阈值照抄 docs/production/runbook.md「首发告警目标」表的备份行
      # （最新备份>26小时、失败增长）——表内没给持续时长，按立即触发处理。
      # 备份新鲜度与失败都来自仓库自控的逻辑备份（deploy/backup.sh 写下的状态文件，
      # 应用 /metrics 暴露），采集只输出计数、时长与布尔。
      # WAL 归档（>30分钟）与归档失败增长来自 pgBackRest，属人工与基础设施安排，
      # 这里不冒充已覆盖。
      - alert: SchoolWallBackupStale
        expr: schoolwall_backup_last_success_age_seconds > 93600
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "SchoolWall latest successful backup is older than twenty-six hours"
          runbook: "docs/production/runbook.md"
      - alert: SchoolWallBackupFailed
        expr: (schoolwall_backup_last_attempt_succeeded == 0 and schoolwall_backup_status_collection_ok == 1) or increase(schoolwall_backup_failures_total[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "SchoolWall backup failed or its failure counter grew"
          runbook: "docs/production/runbook.md"
      - alert: SchoolWallBackupStatusUnknown
        expr: schoolwall_backup_status_collection_ok == 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "SchoolWall backup status is unreadable, backup freshness cannot be judged"
          runbook: "docs/production/runbook.md"
      # 主机容量信号：阈值照抄 docs/production/runbook.md「首发告警目标」表的容量/证书行
      # （磁盘<20%、内存>85% 10分钟、证书<14天）——证书那一半已由
      # SchoolWallCertificateExpiring 覆盖，这里补磁盘与内存两项目标。
      # 指标来自 node_exporter（deploy/monitoring/compose.monitoring.yml 的 node-exporter
      # 服务 + deploy/monitoring/prometheus.yml 的 node-exporter 抓取作业）：
      #   node_filesystem_avail_bytes / node_filesystem_size_bytes —— 根文件系统的可用与总容量
      #   node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes —— 可用与总内存
      # mountpoint 用 ^/(host)?$ 兼容两种挂法：exporter 直接跑在主机上时标签是 "/"，
      # 以 --path.rootfs=/host 跑在容器里时标签可能是 "/host"。
      # 磁盘行表内没给持续时长，按仓库既有做法立即触发（jobs 行与备份行同样没给的项）。
      # 分机型调整阈值、按挂载点分别设限属运维安排，这里不擅自改口径。
      - alert: SchoolWallHostDiskSpaceLow
        expr: (node_filesystem_avail_bytes{job="node-exporter",mountpoint=~"^/(host)?$",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node-exporter",mountpoint=~"^/(host)?$",fstype!~"tmpfs|overlay|squashfs"}) < 0.2
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "SchoolWall root filesystem has less than twenty percent of space available"
          runbook: "docs/production/runbook.md"
      - alert: SchoolWallHostMemoryUsageHigh
        expr: (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) > 0.85
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "SchoolWall host memory usage exceeds eighty-five percent"
          runbook: "docs/production/runbook.md"
