groups:
  - name: schoolwall
    rules:
      - alert: SchoolWallUnavailable
        expr: probe_success{job="schoolwall-probes"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "SchoolWall readiness/liveness probe failed"
          runbook: "docs/production/runbook.md"
      - alert: SchoolWallProbeSlow
        expr: probe_duration_seconds{job="schoolwall-probes"} > 2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "SchoolWall probes exceed two seconds"}
      - alert: SchoolWallCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job="schoolwall-probes"} - time() < 14 * 86400
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "SchoolWall certificate expires within fourteen days"}
      - alert: SchoolWallMonitorTargetMissing
        expr: up{job=~"schoolwall-api|schoolwall-probes"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "SchoolWall monitoring target unavailable"}
      - alert: SchoolWallApiErrors
        expr: sum(rate(schoolwall_http_requests_total{route=~"/api/.*",status=~"5.."}[5m])) / clamp_min(sum(rate(schoolwall_http_requests_total{route=~"/api/.*"}[5m])), 0.001) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "SchoolWall API errors exceed one percent"}
      - alert: SchoolWallApiSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(schoolwall_http_duration_seconds_bucket{route=~"/api/.*"}[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "SchoolWall API p95 exceeds one second"}
