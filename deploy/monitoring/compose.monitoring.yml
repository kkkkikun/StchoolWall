# Linux host networking reaches Nginx's loopback-only metrics listener.
# Every web UI/exporter explicitly binds loopback; use an authenticated SSH tunnel.
name: schoolwall-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.2.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    network_mode: host
    volumes: ["./blackbox.yml:/config/blackbox.yml:ro"]
    command: ["--config.file=/config/blackbox.yml", "--web.listen-address=127.0.0.1:9115"]
    restart: unless-stopped
  # 主机容量信号（磁盘可用空间、内存使用率）的来源。
  # 仓库只提供这套配置：exporter 在主机上的实际部署、挂载路径与机型差异属运维安排。
  # 宿主机根目录以只读方式挂到 /host，node_exporter 用 --path.rootfs=/host 采集宿主的
  # 文件系统与内存指标；监听地址同样只绑 127.0.0.1，与本文件其余 exporter 一致
  # （需要从别处看指标时走已认证的 SSH 隧道，不要把 9100 暴露到公网）。
  node-exporter:
    image: prom/node-exporter:v1.8.2
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      # 排除伪文件系统与容器自身的挂载点，避免把 /etc/hosts 之类的绑定挂载当成磁盘。
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|etc|host|var/lib/docker|var/lib/containers/storage)($$|/)
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
  # DB 锁等待信号（pg_locks / pg_stat_activity 一类）的来源。
  # 仓库只提供这套配置：exporter 在主机上的实际部署、监控账号的创建与授权属运维安排。
  # 连接串与口令只走只读的运行时配置，绝不入库：
  #   - DATA_SOURCE_URI 里只有主机、端口与库名，没有用户名与口令；
  #   - 用户名与口令分别放在宿主机 secret 目录下的两个文件里，以只读方式挂进容器
  #     （DATA_SOURCE_USER_FILE / DATA_SOURCE_PASS_FILE）。
  # secret 目录的宿主机路径由运维决定（默认 /opt/schoolwall/shared/postgres-exporter，
  # 可用 POSTGRES_EXPORTER_SECRET_DIR 覆盖），目录与文件要能让容器内的 uid 65534 读到
  # （参考 deploy/README.md）。
  # 监听地址同样只绑 127.0.0.1（需要从别处看指标时走已认证的 SSH 隧道）。
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    network_mode: host
    environment:
      DATA_SOURCE_URI: "${POSTGRES_EXPORTER_URI:-127.0.0.1:5432/schoolwall?sslmode=disable}"
      DATA_SOURCE_USER_FILE: /etc/postgres-exporter/user
      DATA_SOURCE_PASS_FILE: /etc/postgres-exporter/pass
    volumes:
      - ${POSTGRES_EXPORTER_SECRET_DIR:-/opt/schoolwall/shared/postgres-exporter}:/etc/postgres-exporter:ro
    command: ["--web.listen-address=127.0.0.1:9187"]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    network_mode: host
    volumes: ["./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    restart: unless-stopped
volumes:
  prometheus_data:
