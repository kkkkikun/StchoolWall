global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["/etc/prometheus/alerts.yml"]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["127.0.0.1:9093"]}]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["127.0.0.1:9090"]}]
  # 主机容量信号：node_exporter（deploy/monitoring/compose.monitoring.yml 的 node-exporter
  # 服务）提供磁盘可用空间与内存使用率指标，监听地址 127.0.0.1:9100。
  - job_name: node-exporter
    static_configs: [{targets: ["127.0.0.1:9100"]}]
  # DB 锁等待信号：postgres_exporter（deploy/monitoring/compose.monitoring.yml 的
  # postgres-exporter 服务）提供 pg_stat_activity_count / pg_stat_database_deadlocks
  # / pg_locks_count 等锁与会话等待指标，监听地址 127.0.0.1:9187。
  - job_name: postgres-exporter
    static_configs: [{targets: ["127.0.0.1:9187"]}]
  - job_name: schoolwall-api
    metrics_path: /metrics
    static_configs: [{targets: ["127.0.0.1:9101"]}]
  - job_name: schoolwall-probes
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      # Replace BOTH with actual deployment domain and test alerts before public launch.
      - targets: ["https://REPLACE_DOMAIN/health/live", "https://REPLACE_DOMAIN/health/ready"]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "127.0.0.1:9115"}
