# SchoolWall 网页测试版 nginx 配置
# 用法：把 SERVER_NAME 换成你的域名，软链/复制到 /etc/nginx/sites-available/ 并启用。
# 首次先用 80 端口跑 certbot 签证书，签好后 443 块自动生效（certbot --nginx 会改写）。

server {
    listen 80;
    server_name SERVER_NAME;  # ← 换成你的域名

    # certbot 会自动在此注入 301 跳转与 443 server 块
    # 上传接口 10MB 上限 + 余量
    client_max_body_size 12m;

    # ---- API → 后端 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 用户上传图（后端 /static 提供）----
    # 注意：子目录 = 上传 kind 全集（与 backend UPLOAD_KINDS、frontend vite 代理保持同步）
    location ~ ^/static/(avatars|banners|posts|uploads|parties)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ---- 小程序 H5 构建产物（uni 静态资源同在 /static 下，放在上面的正则之后）----
    location /static/ {
        alias /var/www/schoolwall/h5/static/;
        expires 7d;
    }

    # ---- 管理后台（子路径部署，SPA fallback）----
    location /admin/ {
        alias /var/www/schoolwall/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- H5 主站（hash 路由，无需特殊 fallback）----
    location / {
        root /var/www/schoolwall/h5;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS 块：先跑 `sudo certbot --nginx -d SERVER_NAME`，certbot 自动补全并改写上面的 80 块
# 签发前请确认域名 DNS 已解析到本机，且 80 端口公网可达。
