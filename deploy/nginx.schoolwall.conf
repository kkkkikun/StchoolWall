# Include inside the Nginx http context. Replace SERVER_NAME and issue TLS before launch.
# Never use $request/$request_uri/$args or Authorization/Cookie in application access logs.
log_format schoolwall_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time "$sent_http_x_request_id"';

server {
    listen 80;
    server_name SERVER_NAME;
    access_log /var/log/nginx/schoolwall-access.log schoolwall_safe;
    # Nginx error formatting may include raw requests; application/probe logs carry incidents.
    error_log /dev/null;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location = /health/live {
        proxy_pass http://127.0.0.1:8000/health/live;
        proxy_set_header Host $host;
    }
    location = /health/ready {
        proxy_pass http://127.0.0.1:8000/health/ready;
        proxy_set_header Host $host;
    }
    # Never publish internal metrics. A separate private listener is below.
    location = /metrics { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    # Historical uploaded media require migration + moderation before exposing via approved API.
    # Never proxy any of these to an old public StaticFiles mount.
    location ~ ^/static/(avatars|banners|posts|uploads|parties|private-media|private-verifications)/ { return 404; }
    location /static/ {
        alias /opt/schoolwall/current/web/h5/static/;
        expires 7d;
    }
    location /admin/ {
        alias /opt/schoolwall/current/web/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control no-cache;
    }
    # 电脑端用户界面（面向电脑浏览器的学生端），同源部署，接口复用 /api/ 反代
    location /pc/ {
        alias /opt/schoolwall/current/web/pc/;
        try_files $uri $uri/ /pc/index.html;
        add_header Cache-Control no-cache;
    }
    location / {
        root /opt/schoolwall/current/web/h5;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
# Prometheus must reach this via a private host/container route, never the public vhost.
server {
    listen 127.0.0.1:9101;
    server_name localhost;
    access_log off;
    error_log /dev/null;
    location = /metrics {
        proxy_pass http://127.0.0.1:8000/metrics;
        proxy_set_header Host localhost;
    }
    location / { return 404; }
}
