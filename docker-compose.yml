services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-eywall}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eywall123}
      POSTGRES_DB: ey_wall
    ports:
      # 仅本机可达；生产必须改强密码（并考虑完全不发布端口，走内部网络）
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eywall}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      # 仅本机可达；生产建议加 --requirepass 并同样只绑 127.0.0.1
      - "127.0.0.1:6379:6379"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
